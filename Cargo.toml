[package]
name = "tgram_api"
version = "0.1.0"
edition = "2021"
description = "aiogram-like Telegram Bot API library for Rust"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tgram_api"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"

[features]
default = []
webhook = ["dep:axum"]
fsm-redis = ["dep:redis"]

[dependencies.regex]
version = "1.10"

[dependencies.axum]
version = "0.7"
optional = true
features = ["json"]

[dependencies.redis]
version = "0.27"
optional = true
